name: Public runner explorer

on:
  pull_request:
    paths:
      - 'analysis/build_public_explorer.py'
      - 'analysis/build_runner_lookup.py'
      - 'analysis/build_pacing.py'
      - 'analysis/build_extended.py'
      - 'analysis/source_quality.py'
      - 'analysis/test_public_explorer.py'
      - 'analysis/test_runner_lookup.py'
      - 'analysis/release.json'
      - 'analysis/requirements.txt'
      - 'analysis/download_release.py'
      - 'scripts/verify-public-explorer.cjs'
      - '.github/workflows/public-explorer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          # The exact Python of the local calculation (November 4-5, 2026): analysis/adapt_master.py records the
          # interpreter version in the adapted MANIFEST.json, whose digest every output binds, so another Python
          # gives another digest and the rebuilt outputs cannot match the committed ones.
          python-version: '3.13.16'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install analysis dependencies
        run: python -m pip install -r analysis/requirements.txt
      - name: Check calculations and source contracts
        run: python -m unittest discover -s analysis -p 'test_*.py'
      - name: Download the pinned and verified FULL export
        env:
          # Optional API authentication; release assets download anonymously.
          GH_TOKEN: ${{ github.token }}
        run: python analysis/download_release.py --bundle FULL --output "$RUNNER_TEMP/public-explorer-input"
      - name: Calculate the supporting study and public runner lookup
        run: python analysis/build_public_explorer.py --input "$RUNNER_TEMP/public-explorer-input" --output "$RUNNER_TEMP/public-explorer-output"
      - name: Verify every study result and runner shard
        run: node scripts/verify-public-explorer.cjs --data-root "$RUNNER_TEMP/public-explorer-output"
      - uses: actions/upload-artifact@v4
        with:
          name: public-runner-explorer
          path: |
            ${{ runner.temp }}/public-explorer-output/study/
            ${{ runner.temp }}/public-explorer-output/runners/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
