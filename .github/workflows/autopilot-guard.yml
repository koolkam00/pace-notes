name: Autopilot guard

# Early feedback on what an autopilot pull request may change (scripts/autopilot-guard.cjs, docs/AUTOPILOT.md).
# Branches that do not start with autopilot/ pass at once. This run uses the pull request's own copy of the guard;
# the authoritative run is the Autopilot merge workflow's, which runs main's copy before it merges anything.

on:
  pull_request:

permissions:
  contents: read

jobs:
  autopilot-guard:
    name: autopilot-guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Branch names reach the shell through env, never by ${{ }} expansion inside the script.
      - name: Check what this pull request changes
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: node scripts/autopilot-guard.cjs --base "origin/$BASE_REF" --head HEAD --branch "$HEAD_REF"
