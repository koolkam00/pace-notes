name: Half marathon

# The half-marathon aggregates (docs/HALF_MARATHON.md). The half snapshot, its person links and the stamp reference (the
# producer's earlier corrected edition metadata) are the owner's public CC BY 4.0 releases (analysis/half-release.json),
# downloaded anonymously: no secret is needed.
#
# `check` verifies what the repository alone can show (scripts/verify-half.cjs: provenance, floors and bans, exact
# recounts of the half-only values, consistency of the linked aggregates, and the source-recount receipt written by
# scripts/verify-half-source.cjs), on every pull request that touches the half files.
#
# `source` downloads the pinned public assets (half-dataset-20261030-1904: the snapshot part, its edition_meta CSV and
# README, and the v4 person links; half-dataset-20261029-2157: the stamp reference) with no token in its environment,
# reassembles the snapshot, cuts the links extract (which must equal the pinned digest), rebuilds every file into the
# runner's temp folder, requires the published bytes, and recounts every value in Node. It runs on workflow_dispatch and
# on pushes and pull requests that change the half pin, the policy, a builder, a module the builders import, the
# downloader or the recount (not on every half pull request: proved locally on 2026-10-31, see docs/HALF_MARATHON.md).
#
# The scope regex names every analysis module the half builders import: the half_* modules and build_half.py, and the
# marathon and statistics modules half_marathon.py, half_common.py, half_field.py, half_linked.py and half_women.py import
# (build_fast_start.py, insights_data.py, insights_stats.py, insights_round.py, charts_common.py). Until 2026-10-31 it
# named only the half files, so a change to one of those five could leave the published half files stale with no source
# job to see it (review R13 of the v4 adoption).

on:
  pull_request:
    paths:
      - 'analysis/*half*'
      - 'analysis/half-*.json'
      - 'analysis/build_fast_start.py'
      - 'analysis/insights_data.py'
      - 'analysis/insights_stats.py'
      - 'analysis/insights_round.py'
      - 'analysis/charts_common.py'
      - 'analysis/requirements.txt'
      - 'analysis/release.json'
      - 'analysis/weather-release.json'
      - 'public/data/half/**'
      - 'public/data/runners/manifest.json'
      - 'public/data/weather/evidence.json'
      - 'lib/half*'
      - 'lib/tools/half-to-full.ts'
      - 'lib/nuggets/half.ts'
      - 'components/half/**'
      - 'app/half/**'
      - 'scripts/verify-half*'
      - 'scripts/half/**'
      - 'scripts/nuggets/half.cjs'
      - 'scripts/lib/words.cjs'
      - 'scripts/build-chart-cards.cjs'
      - 'lib/charts/text/half.ts'
      - 'public/charts/cards/half-*'
      - 'docs/evidence/half/**'
      - '.github/workflows/half.yml'
  push:
    branches: [main]
    paths:
      - 'analysis/*half*'
      - 'analysis/half-*.json'
      - 'analysis/build_fast_start.py'
      - 'analysis/insights_data.py'
      - 'analysis/insights_stats.py'
      - 'analysis/insights_round.py'
      - 'analysis/charts_common.py'
      - 'analysis/requirements.txt'
      - 'analysis/release.json'
      - 'analysis/weather-release.json'
      - 'public/data/half/**'
      - 'public/data/runners/manifest.json'
      - 'public/data/weather/evidence.json'
      - 'lib/half*'
      - 'lib/tools/half-to-full.ts'
      - 'lib/nuggets/half.ts'
      - 'components/half/**'
      - 'app/half/**'
      - 'scripts/verify-half*'
      - 'scripts/half/**'
      - 'scripts/nuggets/half.cjs'
      - 'scripts/lib/words.cjs'
      - 'scripts/build-chart-cards.cjs'
      - 'lib/charts/text/half.ts'
      - 'public/charts/cards/half-*'
      - 'docs/evidence/half/**'
      - '.github/workflows/half.yml'
  workflow_dispatch:

permissions:
  contents: read

# One run per branch or pull request: a new push cancels the run still going (the source job downloads 1.3 GB).
concurrency:
  group: half-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r analysis/requirements.txt
      - run: npm ci
      - name: Test the half builders on synthetic sources
        run: python -m unittest discover -s analysis -p 'test_half.py'
      - name: Verify the published half aggregates and the source-recount receipt
        run: node scripts/verify-half.cjs
      - name: The "From the half" card images are current (stamps, sizes, withdrawn cards left out, no orphans)
        run: node scripts/build-chart-cards.cjs --check --set half

  source:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Does this change touch the half pin, policy, builders, a module they import, the downloader or the recount?
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "$BASE" "$HEAD" | grep -Eq '^(analysis/half-release\.json|analysis/half-policy-[0-9-]+\.json|analysis/build_half\.py|analysis/half_[a-z0-9_]+\.py|analysis/(build_fast_start|insights_data|insights_stats|insights_round|charts_common)\.py|analysis/download_half\.py|analysis/requirements\.txt|scripts/verify-half-source\.cjs|scripts/half/(derive|policy|marathon|families)\.cjs|\.github/workflows/half\.yml)$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "skipped: this change touches no half pin, policy, builder, imported module, downloader or recount file"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.scope.outputs.run == 'true'
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.run == 'true'
        with:
          node-version: '22'
          cache: npm
      - if: steps.scope.outputs.run == 'true'
        run: python -m pip install -r analysis/requirements.txt && npm ci && zstd --version
      - name: No token in the environment (the sources are public; every download below is anonymous)
        if: steps.scope.outputs.run == 'true'
        run: |
          for name in GITHUB_TOKEN GH_TOKEN GH_ENTERPRISE_TOKEN GITHUB_PAT; do
            if [ -n "$(printenv "$name" || true)" ]; then echo "::error::$name is set in the source job's environment"; exit 1; fi
          done
          if git config --get-regexp '^http\..*extraheader' >/dev/null; then echo "::error::git carries an auth header"; exit 1; fi
      - name: Room for the sources (4.5 GB half SQLite here; the 0.81 GB of v4 parquet files and DuckDB's spill on the runner's second disk)
        if: steps.scope.outputs.run == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo mkdir -p /mnt/half-work && sudo chown "$(id -u):$(id -g)" /mnt/half-work
          df -h "$RUNNER_TEMP" /mnt
      - name: Download, check and reassemble the pinned public assets, and cut the links extract (anonymous github.com release URLs)
        if: steps.scope.outputs.run == 'true'
        env:
          TMPDIR: /mnt/half-work
          PACE_HALF_DUCKDB_THREADS: '2'
          PACE_HALF_DUCKDB_MEMORY: 4GB
          PACE_HALF_DUCKDB_MAX_TEMP: 4GB
        run: python -I analysis/download_half.py --out "$RUNNER_TEMP/half" --work /mnt/half-work
      - name: The snapshot has no uncommitted pages beside it (a non-empty -wal fails)
        if: steps.scope.outputs.run == 'true'
        run: |
          wal="$RUNNER_TEMP/half/platform_half.sqlite-wal"
          if [ -s "$wal" ]; then echo "::error::$wal is not empty"; exit 1; fi
          df -h "$RUNNER_TEMP" /mnt
      - name: Rebuild the half aggregates from the downloaded sources
        if: steps.scope.outputs.run == 'true'
        env:
          TMPDIR: /mnt/half-work
          PACE_HALF_DIR: ${{ runner.temp }}/half
          PACE_HALF_DUCKDB_THREADS: '2'
          PACE_HALF_DUCKDB_MEMORY: 4GB
          PACE_HALF_DUCKDB_MAX_TEMP: 4GB
        run: >-
          python -I analysis/build_half.py --half "$PACE_HALF_DIR/platform_half.sqlite" --links "$PACE_HALF_DIR/links-v4.sqlite"
          --stamp-reference "$PACE_HALF_DIR/half-dataset-20261029-2157/csv-edition_meta.csv.zst"
          --edition-meta "$PACE_HALF_DIR/csv-edition_meta.csv.zst" --out "$RUNNER_TEMP/half-out"
      - name: The rebuilt files must equal the published bytes
        if: steps.scope.outputs.run == 'true'
        run: |
          cd public/data/half
          find . -name '*.json' | sort | while read -r file; do
            cmp "$file" "$RUNNER_TEMP/half-out/$file"
          done
          test "$(find "$RUNNER_TEMP/half-out" -name '*.json' | wc -l)" = "$(find . -name '*.json' | wc -l)"
      - name: Recount every published value from the sources in Node
        if: steps.scope.outputs.run == 'true'
        env:
          PACE_HALF_DIR: ${{ runner.temp }}/half
        run: >-
          node scripts/verify-half-source.cjs --half "$PACE_HALF_DIR/platform_half.sqlite" --links "$PACE_HALF_DIR/links-v4.sqlite"
          --stamp-reference "$PACE_HALF_DIR/half-dataset-20261029-2157/csv-edition_meta.csv.zst"
          --edition-meta "$PACE_HALF_DIR/csv-edition_meta.csv.zst" --no-write
