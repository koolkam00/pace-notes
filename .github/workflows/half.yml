name: Half marathon

# The half-marathon aggregates (docs/HALF_MARATHON.md). The half snapshot and its links are private: this repository's
# Actions token cannot read the repository that holds them, so the `check` job verifies what the repository alone can
# show (scripts/verify-half.cjs: provenance, floors and bans, exact recounts of the half-only values, consistency of the
# linked aggregates, and the source-recount receipt written locally by scripts/verify-half-source.cjs). It is weaker
# than the marathon pattern, where CI rebuilds every figure from public shards.
#
# The `source` job (manual only) rebuilds from the private sources when the owner has stored a read-only token as the
# HALF_SOURCE_TOKEN secret (owner question Q2; by default no such secret exists and the job says so and succeeds).

on:
  pull_request:
    paths:
      - 'analysis/*half*'
      - 'analysis/half-*.json'
      - 'analysis/release.json'
      - 'analysis/weather-release.json'
      - 'public/data/half/**'
      - 'public/data/runners/manifest.json'
      - 'public/data/weather/evidence.json'
      - 'lib/half*'
      - 'lib/tools/half-to-full.ts'
      - 'lib/nuggets/half.ts'
      - 'components/half/**'
      - 'app/half/**'
      - 'scripts/verify-half*'
      - 'scripts/half/**'
      - 'scripts/nuggets/half.cjs'
      - 'scripts/lib/words.cjs'
      - 'docs/evidence/half/**'
      - '.github/workflows/half.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r analysis/requirements.txt
      - run: npm ci
      - name: Test the half builders on synthetic sources
        run: python -m unittest discover -s analysis -p 'test_half.py'
      - name: Verify the published half aggregates and the source-recount receipt
        run: node scripts/verify-half.cjs

  source:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Is there a source token?
        id: token
        env:
          HALF_SOURCE_TOKEN: ${{ secrets.HALF_SOURCE_TOKEN }}
        run: |
          if [ -z "$HALF_SOURCE_TOKEN" ]; then
            echo "skipped: no source token (owner decision Q2)"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.token.outputs.present == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: steps.token.outputs.present == 'true'
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        if: steps.token.outputs.present == 'true'
        with:
          node-version: '22'
          cache: npm
      - if: steps.token.outputs.present == 'true'
        run: python -m pip install -r analysis/requirements.txt && npm ci
      - name: Download and verify the half snapshot and the links (the token goes to api.github.com only)
        if: steps.token.outputs.present == 'true'
        env:
          HALF_SOURCE_TOKEN: ${{ secrets.HALF_SOURCE_TOKEN }}
        run: python -I analysis/download_half.py --token-env HALF_SOURCE_TOKEN --out "$RUNNER_TEMP/half"
      - name: Rebuild the half aggregates from the private sources
        if: steps.token.outputs.present == 'true'
        env:
          TMPDIR: ${{ runner.temp }}
        run: python -I analysis/build_half.py --half "$RUNNER_TEMP/half/platform_half.sqlite" --links "$RUNNER_TEMP/half/links-slim.sqlite" --out "$RUNNER_TEMP/half-out"
      - name: The rebuilt files must equal the published bytes
        if: steps.token.outputs.present == 'true'
        run: |
          cd public/data/half
          find . -name '*.json' | sort | while read -r file; do
            cmp "$file" "$RUNNER_TEMP/half-out/$file"
          done
          test "$(find "$RUNNER_TEMP/half-out" -name '*.json' | wc -l)" = "$(find . -name '*.json' | wc -l)"
      - name: Recount every published value from the sources in Node
        if: steps.token.outputs.present == 'true'
        run: node scripts/verify-half-source.cjs --half "$RUNNER_TEMP/half/platform_half.sqlite" --links "$RUNNER_TEMP/half/links-slim.sqlite" --no-write
