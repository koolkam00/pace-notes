name: Half marathon

# The half-marathon aggregates (docs/HALF_MARATHON.md). The half snapshot, its links and the corrected edition metadata
# are the owner's public CC BY 4.0 releases (analysis/half-release.json), downloaded anonymously: no secret is needed.
#
# `check` verifies what the repository alone can show (scripts/verify-half.cjs: provenance, floors and bans, exact
# recounts of the half-only values, consistency of the linked aggregates, and the source-recount receipt written by
# scripts/verify-half-source.cjs), on every pull request that touches the half files.
#
# `source` downloads the pinned public assets, rebuilds every file into the runner's temp folder, requires the published
# bytes, and recounts every value in Node. It runs on workflow_dispatch and on pushes and pull requests that change the
# half pin, the policy, a builder or the recount (not on every half pull request: it takes about 15 minutes and 10 GB).

on:
  pull_request:
    paths:
      - 'analysis/*half*'
      - 'analysis/half-*.json'
      - 'analysis/release.json'
      - 'analysis/weather-release.json'
      - 'public/data/half/**'
      - 'public/data/runners/manifest.json'
      - 'public/data/weather/evidence.json'
      - 'lib/half*'
      - 'lib/tools/half-to-full.ts'
      - 'lib/nuggets/half.ts'
      - 'components/half/**'
      - 'app/half/**'
      - 'scripts/verify-half*'
      - 'scripts/half/**'
      - 'scripts/nuggets/half.cjs'
      - 'scripts/lib/words.cjs'
      - 'scripts/build-chart-cards.cjs'
      - 'lib/charts/text/half.ts'
      - 'public/charts/cards/half-*'
      - 'docs/evidence/half/**'
      - '.github/workflows/half.yml'
  push:
    branches: [main]
    paths:
      - 'analysis/*half*'
      - 'analysis/half-*.json'
      - 'analysis/release.json'
      - 'analysis/weather-release.json'
      - 'public/data/half/**'
      - 'public/data/runners/manifest.json'
      - 'public/data/weather/evidence.json'
      - 'lib/half*'
      - 'lib/tools/half-to-full.ts'
      - 'lib/nuggets/half.ts'
      - 'components/half/**'
      - 'app/half/**'
      - 'scripts/verify-half*'
      - 'scripts/half/**'
      - 'scripts/nuggets/half.cjs'
      - 'scripts/lib/words.cjs'
      - 'scripts/build-chart-cards.cjs'
      - 'lib/charts/text/half.ts'
      - 'public/charts/cards/half-*'
      - 'docs/evidence/half/**'
      - '.github/workflows/half.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r analysis/requirements.txt
      - run: npm ci
      - name: Test the half builders on synthetic sources
        run: python -m unittest discover -s analysis -p 'test_half.py'
      - name: Verify the published half aggregates and the source-recount receipt
        run: node scripts/verify-half.cjs
      - name: The "From the half" card images are current (stamps, sizes, withdrawn cards left out, no orphans)
        run: node scripts/build-chart-cards.cjs --check --set half

  source:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Does this change touch the half pin, policy, builders or recount?
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "$BASE" "$HEAD" | grep -Eq '^(analysis/half-release\.json|analysis/half-policy-[0-9-]+\.json|analysis/build_half\.py|analysis/half_[a-z_]+\.py|scripts/verify-half-source\.cjs|scripts/half/(derive|policy|marathon|families)\.cjs|\.github/workflows/half\.yml)$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "skipped: this change touches no half pin, policy, builder or recount file"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.scope.outputs.run == 'true'
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.run == 'true'
        with:
          node-version: '22'
          cache: npm
      - if: steps.scope.outputs.run == 'true'
        run: python -m pip install -r analysis/requirements.txt && npm ci && zstd --version
      - name: Room for the sources (3.7 GB half SQLite here; the 5.3 GB links SQLite on the runner's second disk)
        if: steps.scope.outputs.run == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo mkdir -p /mnt/half-links && sudo chown "$(id -u):$(id -g)" /mnt/half-links
          df -h "$RUNNER_TEMP" /mnt
      - name: Download and verify the pinned public assets (anonymous github.com release URLs, no token)
        if: steps.scope.outputs.run == 'true'
        run: python -I analysis/download_half.py --out "$RUNNER_TEMP/half" --links-work /mnt/half-links
      - name: Rebuild the half aggregates from the downloaded sources
        if: steps.scope.outputs.run == 'true'
        env:
          TMPDIR: ${{ runner.temp }}
          PACE_HALF_DIR: ${{ runner.temp }}/half
        run: python -I analysis/build_half.py --half "$PACE_HALF_DIR/platform_half.sqlite" --links "$PACE_HALF_DIR/links-slim.sqlite" --out "$RUNNER_TEMP/half-out"
      - name: The rebuilt files must equal the published bytes
        if: steps.scope.outputs.run == 'true'
        run: |
          cd public/data/half
          find . -name '*.json' | sort | while read -r file; do
            cmp "$file" "$RUNNER_TEMP/half-out/$file"
          done
          test "$(find "$RUNNER_TEMP/half-out" -name '*.json' | wc -l)" = "$(find . -name '*.json' | wc -l)"
      - name: Recount every published value from the sources in Node
        if: steps.scope.outputs.run == 'true'
        env:
          PACE_HALF_DIR: ${{ runner.temp }}/half
        run: node scripts/verify-half-source.cjs --half "$PACE_HALF_DIR/platform_half.sqlite" --links "$PACE_HALF_DIR/links-slim.sqlite" --no-write
