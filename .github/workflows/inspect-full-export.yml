name: Inspect complete marathon export

on:
  pull_request:
    paths:
      - 'analysis/download_release.py'
      - 'analysis/test_download_release.py'
      - 'analysis/inspect_export.py'
      - 'analysis/audit_expanded.py'
      - '.github/workflows/inspect-full-export.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Export release tag (blank uses analysis/release.json)
        required: false
        type: string

permissions:
  contents: read

jobs:
  inspect:
    if: >-
      github.repository == 'koolkam00/pace-notes'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          # The exact Python of the local calculation (November 4-5, 2026): analysis/adapt_master.py records the
          # interpreter version in the adapted MANIFEST.json, whose digest every output binds, so another Python
          # gives another digest and the rebuilt outputs cannot match the committed ones.
          python-version: '3.13.16'
      - run: python -m pip install -r analysis/requirements.txt
      - name: Check public release downloads
        run: python -m unittest discover -s analysis -p 'test_download_release.py'
      - name: Download and verify FULL export
        env:
          # Optional for API rate limits; public assets download anonymously.
          GH_TOKEN: ${{ github.token }}
          PACING_RELEASE_TAG: ${{ inputs.release_tag || '' }}
        run: python analysis/download_release.py --bundle FULL --output "$RUNNER_TEMP/pacing-full-input" --tag "$PACING_RELEASE_TAG"
      - name: Inspect every table and column without exporting runner rows
        run: python analysis/inspect_export.py --input "$RUNNER_TEMP/pacing-full-input" --output "$RUNNER_TEMP/pacing-full-inspection"
      - name: Audit linked histories and supplied race overlays
        run: python analysis/audit_expanded.py --input "$RUNNER_TEMP/pacing-full-input" --output "$RUNNER_TEMP/pacing-full-inspection"
      - uses: actions/upload-artifact@v4
        with:
          name: pacing-full-export-inspection
          path: ${{ runner.temp }}/pacing-full-inspection/
          if-no-files-found: error
          retention-days: 7
